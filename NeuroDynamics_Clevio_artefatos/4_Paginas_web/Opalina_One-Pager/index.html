<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Opalina One-Pager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: caderno de laboratório da NeuroDynamics. Barra fixa de abas no topo; cada aba é uma folha (one-pager) com a mesma ordem de blocos, para a equipe achar tudo sempre no mesmo lugar. Verde-lima da marca como acento. */
:root{
  --bg:#f5f6f1; --surface:#ffffff; --sunk:#eceee5; --ink:#15171a; --muted:#565c52; --line:#d9ddcf;
  --accent:#5c7700; --accent-strong:#a8c30f; --on-accent:#14180a; --accent-soft:#eef4d2;
  --ok:#2f7a3a; --ok-soft:#e2f1e2; --warn:#9a5b00; --warn-soft:#fbefd9; --crit:#b3261e; --crit-soft:#fbe3e1; --info:#245d9c; --info-soft:#e1ecf8;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0f12; --surface:#16181c; --sunk:#1c1f24; --ink:#eef0e8; --muted:#a4aa9d; --line:#2b2f35;
  --accent:#b9d42a; --accent-strong:#a8c30f; --on-accent:#14180a; --accent-soft:#232a10;
  --ok:#7ccf86; --ok-soft:#16281a; --warn:#f0b35a; --warn-soft:#2c2213; --crit:#f2867e; --crit-soft:#2e1816; --info:#8dbcf0; --info-soft:#152335;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f12; --surface:#16181c; --sunk:#1c1f24; --ink:#eef0e8; --muted:#a4aa9d; --line:#2b2f35;
  --accent:#b9d42a; --accent-strong:#a8c30f; --on-accent:#14180a; --accent-soft:#232a10;
  --ok:#7ccf86; --ok-soft:#16281a; --warn:#f0b35a; --warn-soft:#2c2213; --crit:#f2867e; --crit-soft:#2e1816; --info:#8dbcf0; --info-soft:#152335;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.label{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}

/* topo */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand img{width:30px;height:30px;border-radius:7px}
.brand b{font-family:var(--display);font-weight:800;font-size:17px}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:8px}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;padding:6px 11px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);border-color:var(--line)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs .sep{flex:0 0 1px;background:var(--line);margin:4px 4px}

main{padding-block:28px 64px}
section.page{display:grid;gap:22px}

/* folha */
.hero{display:grid;gap:14px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.hero .lead{font-size:19px;line-height:1.5;max-width:60ch}
.thesis{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.2vw,22px);color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.media{background:#0b0c0e;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.media video{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.media figcaption{font-family:var(--mono);font-size:11px;color:#b9beb3;padding:7px 10px;letter-spacing:.04em}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.card.sunk{background:var(--sunk);border-color:transparent}
.card.callout{background:var(--accent-soft);border-color:transparent}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
ul.clean li::marker{color:var(--accent)}

/* números */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{border-top:3px solid var(--accent-strong);padding-top:8px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}

/* ciclo */
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:s}
.step{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px;display:grid;gap:6px;align-content:start}
.step .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--on-accent);background:var(--accent-strong);width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.step h3{font-size:15.5px}
.step p{font-size:14.5px;color:var(--muted)}
.step:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:16px;font-weight:700;color:var(--accent);background:var(--bg);width:14px;text-align:center}
.loopback{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}

/* TRL */
.trl{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.trl i{height:10px;border-radius:2px;background:var(--line)}
.trl i.on{background:var(--accent-strong)}
.trl-lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted)}

/* editais */
.fit{display:grid;gap:8px}
.fitrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.fitrow:first-child{border-top:0;padding-top:0}
.fitrow .why{font-size:14.5px;color:var(--muted)}
.dl{font-family:var(--mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}

.pitch{font-size:18px;line-height:1.55;font-style:italic;max-width:68ch}
.copy{justify-self:start;font:600 13px var(--body);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
.sources{font-size:13.5px;color:var(--muted)}

/* visão geral */
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start;transition:border-color .15s}
.pcard:hover{border-color:var(--accent)}
.pcard .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.pcard h3{font-size:21px}
.pcard p{font-size:14.5px;color:var(--muted)}
.timeline{display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:8px 0 8px 16px;position:relative}
.tl::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--accent-strong);border:2px solid var(--bg)}
.tl .when{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}

/* tabela editais */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:14.5px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.urgent{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.dlcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px}
.dlcard .days{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.dlcard.hot .days{color:var(--crit)}
.dlcard.soon .days{color:var(--warn)}

/* passo a passo */
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:st}
ol.steps>li{counter-increment:st;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
ol.steps>li::before{content:counter(st);font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);line-height:1.1}
ol.steps li .body{display:grid;gap:6px;min-width:0}
.check{display:grid;gap:8px}
.check label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.verdict{font-weight:700}
dl.gloss{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
dl.gloss dt,dl.gloss dd{margin:0;padding:10px 14px;border-top:1px solid var(--line)}
dl.gloss dt{font-weight:700}
dl.gloss dt:first-of-type,dl.gloss dd:first-of-type{border-top:0}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}

@media (max-width:820px){
  .hero,.grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .loop{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step:nth-child(2)::after{display:none}
}
@media (max-width:480px){
  .loop{grid-template-columns:minmax(0,1fr)}
  .step::after{display:none}
  .fitrow{grid-template-columns:minmax(0,1fr)}
  dl.gloss{grid-template-columns:minmax(0,1fr)}
  dl.gloss dd{border-top:0;padding-top:0}
  .tl{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function days(iso){ if(!iso) return null; const d=new Date(iso+"T23:59:00-03:00"); return Math.ceil((d-TODAY)/86400000); }
function br(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function dlChip(e){
  const n=days(e.prazo);
  if(n===null) return `<span class="chip">${e.prazoTxt}</span>`;
  if(n<0) return `<span class="chip">Encerrado em ${br(e.prazo)}</span>`;
  const cls = n<=14?"crit":n<=45?"warn":"info";
  return `<span class="chip ${cls} dl">${br(e.prazo)} · ${n===0?"hoje":n+" dias"}</span>`;
}

function outras(){

}

function editais(){
  const SP=SOLO?PROJ.find(x=>x.id===SOLO):null; const keep=SP?new Set(SP.editais.map(x=>x[0])):null;
  const all=Object.entries(ED).filter(([k])=>k!=="patrocinio"&&(!keep||keep.has(k)));
  const open=all.filter(([,e])=>e.prazo&&days(e.prazo)>=0).sort((a,b)=>days(a[1].prazo)-days(b[1].prazo));
  const projOf=id=>PROJ.filter(p=>p.editais.some(x=>x[0]===id)).map(p=>p.nome.split(" ·")[0]);
  const extra={profix:["Institucional"],paep:["Fórum (evento)"],oet:["Fórum (evento)"],arc:["Fórum (evento)"],embrapii:["Arabella"],"hz-twin":["Arabella"]};
  const rows=Object.entries(ED).filter(([k])=>!keep||keep.has(k)).map(([id,e])=>{const ps=[...projOf(id),...(extra[id]||[])];return `<tr><td><b>${e.nome}</b><div class="small muted">${e.tipo}</div></td><td class="num">${e.valor}</td><td>${dlChip(e)}${e.prazo2?`<div class="small muted" style="margin-top:4px">${e.prazo2}</div>`:""}</td><td class="small">${e.quem}${e.obs?` <i>${e.obs}</i>`:""}</td><td class="small">${ps.join(", ")||"—"}</td><td class="small">${e.passo}</td></tr>`}).join("");
  return `
  <div style="display:grid;gap:10px;max-width:780px">
    <span class="label">Captação de recursos</span>
    <h1>${SP?"Editais que combinam com "+SP.nome.split(" ·")[0]:"Editais em aberto"}</h1>
    <p class="lead" style="font-size:18px">Valores e prazos levantados em 15/10/2026 no documento “Oportunidades de Financiamento e Parcerias”. Os dias restantes são calculados a partir de hoje. Antes de começar qualquer proposta, confira o edital no site oficial: prazos mudam.</p>
  </div>

  <div class="urgent">${open.slice(0,6).map(([id,e])=>{const n=days(e.prazo);return `<div class="dlcard ${n<=14?"hot":n<=45?"soon":""}"><span class="label">${e.tipo}</span><span class="days">${n===0?"hoje":n+" dias"}</span><b>${e.nome}</b><span class="small muted">até ${br(e.prazo)}</span></div>`}).join("")}</div>

  ${SP?`<div class="card callout"><span class="label">Por que cada um combina com ${SP.nome.split(" ·")[0]}</span><ul class="clean">${SP.editais.map(([id,l,why])=>`<li><b>${ED[id].nome}</b> (${FIT[l][0].toLowerCase()}): ${why} <span class="muted">Primeiro passo: ${ED[id].passo}</span></li>`).join("")}</ul></div>`:""}
  <div class="card callout" ${SP?"hidden":""}>
    <span class="label">Recomendação para os próximos 30 dias</span>
    <ul class="clean">
      <li><b>FME Transforma (30/10):</b> é a aposta mais imediata. Escolher <b>um</b> projeto, Órion ou Opalina, com o Prof. Henrique como coordenador.</li>
      <li><b>Profix-CB (03/11):</b> só se houver um doutor sem vínculo pronto para entrar. Se não houver, deixar passar.</li>
      <li><b>HUBMG GOV (prévia 27/11):</b> ler os desafios publicados esta semana. Se nenhum for de saúde, descartar.</li>
      <li><b>Eventos:</b> CAPES PAEP (20/10) e FAPEMIG OET (27/10) estão muito próximos. Para o Fórum, mirar CNPq ARC (04/12) ou a OET de 26/01/2027.</li>
      <li><b>Sem prazo, mas de maior valor:</b> abrir conversa com a Visuri sobre Embrapii, e com INRIA/Montpellier sobre CNPq–ANR (31/03/2027).</li>
    </ul>
  </div>

  <div class="tablewrap"><table>
    <thead><tr><th>Edital</th><th>Valor</th><th>Prazo</th><th>Quem pode / exige</th><th>Combina com</th><th>Primeiro passo</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>

  <div class="card sunk">
    <span class="label">Já encerrados, mas servem de referência</span>
    <ul class="clean small">
      <li><b>Finep Mais Inovação Brasil · Saúde, linha de dispositivos médicos:</b> R$ 5 a 15 milhões por projeto, R$ 300 milhões no total. Encerrado em 18/09/2026.</li>
      <li><b>Finep Mais Inovação Brasil · Tecnologias Digitais:</b> R$ 5 a 25 milhões (em rede, até R$ 40 milhões). Encerrado em 14/10/2026.</li>
    </ul>
    <p class="small">Quando reabrirem, a NeuroDynamics entra como ICT ao lado de uma empresa. O orçamento é dividido por atividade; não há cota automática para o grupo.</p>
  </div>
  <p class="note">A lista combina opções de maior aderência com oportunidades que dependem de montar projetos e alianças. Nenhuma garante aprovação: a seleção depende do mérito e das regras de cada chamada. No Horizon, a parte brasileira precisa de uma fonte de financiamento própria e elegível.</p>`;
}

const GO = [
  "Somos elegíveis? (tipo de instituição, titulação do coordenador, vínculo, PPG, empresa parceira)",
  "Quem é o proponente formal? (UFMG, fundação de apoio, empresa?) E ele topa?",
  "O tema do edital bate com um projeto nosso sem forçar a barra?",
  "Temos as parcerias exigidas por escrito, ou dá para conseguir antes do prazo? (carta do hospital, da empresa, do órgão)",
  "O valor e o que pode ser pago (bolsa, material, equipamento, serviço) resolvem o nosso bloqueio real?",
  "Há tempo: pelo menos 3 semanas para um edital simples, 2 a 3 meses para consórcio ou Embrapii?",
  "Existe alguém com nome e prazo para escrever, orçar e juntar documentos?"
];

function submeter(){
  return `
  <div style="display:grid;gap:10px;max-width:780px">
    <span class="label">Guia prático para a equipe</span>
    <h1>Como ler um edital e submeter</h1>
    <p class="lead" style="font-size:18px">Um edital (ou chamada) é um contrato de regras: diz quem pode pedir, quanto, para quê, até quando e como vai avaliar. Quem segue as regras à risca e escreve pensando no avaliador já sai na frente.</p>
  </div>

  <div class="grid2">
    <div class="card">
      <span class="label">Triagem: vale a pena entrar?</span>
      <p class="small muted">Marque o que já está garantido. Com 6 ou 7, siga em frente. Com menos de 5, prefira o próximo edital.</p>
      <div class="check" id="gocheck">${GO.map((g,i)=>`<label for="go${i}"><input type="checkbox" id="go${i}"><span>${g}</span></label>`).join("")}</div>
      <p class="verdict" id="verdict" aria-live="polite"></p>
    </div>
    <div class="card">
      <span class="label">O que caçar no texto do edital</span>
      <ul class="clean small">
        <li><b>Objeto:</b> o que o financiador quer comprar. Copie as palavras dele na proposta.</li>
        <li><b>Elegibilidade:</b> quem pode ser coordenador, instituição, parceiros obrigatórios.</li>
        <li><b>Itens financiáveis:</b> bolsa, custeio (material, serviço, viagem) e capital (equipamento). O que não está na lista não pode ser pedido.</li>
        <li><b>Contrapartida:</b> se a instituição ou empresa precisa entrar com recurso ou horas.</li>
        <li><b>Critérios de avaliação e pesos:</b> monte a proposta na ordem deles.</li>
        <li><b>Documentos:</b> Lattes, cartas, aprovação de ética, declarações.</li>
        <li><b>Sistema de envio:</b> crie o login com antecedência (FAPEMIG Everest, Plataforma Carlos Chagas do CNPq, Funding &amp; Tenders da União Europeia).</li>
      </ul>
    </div>
  </div>

  <div style="display:grid;gap:10px">
    <span class="label">Passo a passo da submissão</span>
    <ol class="steps">
      <li><div class="body"><h3>Leia o edital inteiro e faça a ficha</h3><p class="small">Uma página com: objeto, valor, prazo (dia e hora), elegibilidade, itens financiáveis, critérios e documentos. Coloque a ficha na pasta do edital no Drive.</p></div></li>
      <li><div class="body"><h3>Escolha um projeto e um coordenador</h3><p class="small">Um edital, um projeto. Quase sempre o coordenador precisa ser doutor com vínculo; na NeuroDynamics, em geral, o Prof. Henrique. Combine com ele antes de escrever.</p></div></li>
      <li><div class="body"><h3>Acione a FCO e a CTIT cedo</h3><p class="small">A FCO assessora submissão, orçamento e gestão financeira. A CTIT cuida de propriedade intelectual e acordos com empresas. Procure as duas na primeira semana, não na última.</p></div></li>
      <li><div class="body"><h3>Peça as cartas e documentos dos parceiros</h3><p class="small">Carta de anuência do hospital, carta de parceria da Visuri, manifestação do órgão público (HUBMG). Envie um modelo pronto para o parceiro só assinar. Para estudo com pacientes, cite o protocolo e a situação no Comitê de Ética (CEP).</p></div></li>
      <li><div class="body"><h3>Escreva usando a folha do projeto</h3><p class="small">Estrutura que funciona na maioria dos editais: problema com número, solução, o que já foi feito (TRL e marcos), objetivos geral e específicos, metodologia, cronograma em metas, equipe, orçamento, impacto e riscos. Os blocos desta página já são o rascunho de cada parte.</p></div></li>
      <li><div class="body"><h3>Monte o orçamento ligado às entregas</h3><p class="small">Cada item responde “para qual meta isso serve?”. Separe bolsa, custeio e capital. Use cotações reais. Despesas seguem a aprovação do coordenador e as regras da UFMG e do financiador.</p></div></li>
      <li><div class="body"><h3>Faça uma avaliação simulada</h3><p class="small">Alguém de fora do projeto dá nota usando os critérios do edital. Corrija o que ficou fraco. Confira limites de caracteres e formatos.</p></div></li>
      <li><div class="body"><h3>Submeta 48 horas antes</h3><p class="small">Sistemas caem no último dia. Salve o comprovante e o PDF enviado na pasta do edital.</p></div></li>
      <li><div class="body"><h3>Registre e acompanhe</h3><p class="small">Anote resultado, nota e parecer. Mesmo uma recusa vira material para a próxima chamada.</p></div></li>
    </ol>
  </div>

  <div class="grid2">
    <div class="card callout">
      <span class="label">Modelo de e-mail para pedir carta de parceria</span>
      <p class="small" id="mailtpl" style="white-space:pre-line">Assunto: Carta de parceria – [nome do edital] – NeuroDynamics/UFMG

Olá, [nome],
Vamos submeter o projeto [Órion/Opalina/Calima] ao [edital], com prazo em [data]. A proposta prevê [papel do parceiro, ex.: execução dos testes clínicos no InCor].
Para a submissão, precisamos de uma carta de parceria assinada. Segue um modelo pronto em anexo; basta ajustar o que quiser e assinar.
Conseguimos receber até [data, 1 semana antes do prazo]?
Obrigado,
[nome] – Relações Institucionais, NeuroDynamics (Escola de Engenharia da UFMG)</p>
      <button class="copy" type="button" data-copy="mailtpl">Copiar modelo</button>
    </div>
    <div class="card">
      <span class="label">Erros que eliminam propostas</span>
      <ul class="clean small">
        <li>Coordenador que não cumpre a elegibilidade.</li>
        <li>Pedir item que o edital não financia.</li>
        <li>Faltar uma carta ou documento obrigatório.</li>
        <li>Proposta genérica, que serviria para qualquer edital.</li>
        <li>Orçamento sem ligação com as metas.</li>
        <li>Deixar para enviar na última hora.</li>
      </ul>
    </div>
  </div>

  <div style="display:grid;gap:10px">
    <span class="label">Glossário rápido</span>
    <dl class="gloss">
      <dt>Edital / chamada</dt><dd>Documento que define as regras de uma seleção de projetos.</dd>
      <dt>Proponente</dt><dd>Quem assina e responde pela proposta (pessoa ou instituição).</dd>
      <dt>ICT</dt><dd>Instituição de Ciência e Tecnologia, como a UFMG.</dd>
      <dt>Fundação de apoio</dt><dd>Entidade que gerencia o dinheiro do projeto para a universidade (ex.: FCO).</dd>
      <dt>Contrapartida</dt><dd>O que a instituição ou empresa entra de recurso próprio, em dinheiro ou horas.</dd>
      <dt>Bolsa · custeio · capital</dt><dd>Pagamento a pessoas · material, serviço e viagem · equipamento que fica de patrimônio.</dd>
      <dt>TRL</dt><dd>Nível de maturidade tecnológica, de 1 (ideia) a 9 (produto no mercado). Muitos editais pedem.</dd>
      <dt>Fluxo contínuo</dt><dd>Sem prazo fixo; recebe propostas enquanto houver orçamento.</dd>
      <dt>Carta de anuência</dt><dd>Documento em que um parceiro confirma que participa e o que vai fazer.</dd>
      <dt>CEP / CONEP</dt><dd>Comitês de ética que aprovam pesquisa com seres humanos.</dd>
      <dt>PPG</dt><dd>Programa de pós-graduação (mestrado e doutorado).</dd>
      <dt>Consórcio</dt><dd>Grupo de instituições de vários países que submete um projeto único (Horizon Europe).</dd>
    </dl>
  </div>`;
}

const ROUTES = {visao:overview, outras, editais, submeter};
PROJ.forEach(p=>ROUTES[p.id]=()=>projectPage(p));

if(SOLO){const p=PROJ.find(x=>x.id===SOLO);document.getElementById("sub").textContent="One-pager · "+p.nome+" · out/2026";}
function render(){
  let id=(location.hash||"").replace("#","");
  if(SOLO && !["editais","submeter",SOLO].includes(id)) id=SOLO;
  if(!ROUTES[id]) id=SOLO||"visao";
  document.getElementById("tabs").innerHTML=tabsHTML(id);
  document.getElementById("app").innerHTML=`<section class="page" id="pg-${id}">${ROUTES[id]()}</section>`;
  const cur=document.querySelector('nav.tabs a[aria-current]'); if(cur) cur.scrollIntoView({block:"nearest",inline:"center"});
  if(id==="submeter") initCheck();
}
function initCheck(){
  let saved=[]; try{saved=JSON.parse(localStorage.getItem("go")||"[]")}catch(e){}
  const boxes=[...document.querySelectorAll("#gocheck input")];
  boxes.forEach((b,i)=>{b.checked=!!saved[i]; b.addEventListener("change",upd)});
  function upd(){
    const st=boxes.map(b=>b.checked); try{localStorage.setItem("go",JSON.stringify(st))}catch(e){}
    const n=st.filter(Boolean).length, v=document.getElementById("verdict");
    v.textContent = n>=6?`${n} de 7: siga em frente.`: n>=5?`${n} de 7: dá para entrar se resolver o que falta nesta semana.`:`${n} de 7: melhor mirar o próximo edital.`;
    v.style.color = n>=6?"var(--ok)":n>=5?"var(--warn)":"var(--crit)";
  }
  upd();
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]"); if(!b) return;
  const el=document.getElementById(b.dataset.copy); const txt=el.innerText.trim();
  const ok=()=>{b.textContent="Copiado"; setTimeout(()=>b.textContent=b.dataset.copy.startsWith("pitch")?"Copiar pitch":"Copiar modelo",1600)};
  const fallback=()=>{const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Texto selecionado"};
  try{ navigator.clipboard.writeText(txt).then(ok,fallback) }catch(err){ fallback() }
});
addEventListener("hashchange",()=>{render(); scrollTo(0,0)});
render();
</script>
