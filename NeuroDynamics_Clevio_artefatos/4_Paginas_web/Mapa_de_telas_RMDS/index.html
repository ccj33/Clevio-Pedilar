<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mapa de telas RMDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra de ferramentas no topo, canvas cinza-claro com raias (quem usa) x etapas, inspetor à direita. As telas do app usam identidade própria (azul-marinho, destaque amarelo, Atkinson Hyperlegible). Claro fixo a pedido. */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#15181D; --mute:#5F6873; --faint:#949CA7; --line:#E3E6EB; --line2:#D2D6DD; --soft:#F3F4F6;
  --sel:#2F6BFF; --sel-s:#E8EFFF; --ok:#1E8A5A; --warn:#B26A00; --err:#C23B3B;
  --c-g:#D9731A; --c-p:#7A5AD0; --c-i:#1E8A5A; --c-n:#2F5FD0; --c-d:#C23B3B; --c-x1:#0E8AA0; --c-x2:#B5467A; --c-x3:#7C8A1F; --c-x4:#555F6E;
  --p-ink:#10223F; --p-bg:#FFFFFF; --p-soft:#F3F5F9; --p-line:#E3E8F0; --p-mute:#56637A; --p-acc:#F2B01E; --p-acc-s:#FFF4D2;
  --p-ok:#1A7048; --p-wait:#2B55C4; --p-pend:#935A00; --p-err:#B3261E;
  --f-ui:'Geist',system-ui,sans-serif; --f-mono:'Geist Mono',ui-monospace,monospace; --f-app:'Atkinson Hyperlegible',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:auto}
button,input,select,textarea{font-family:inherit;color:inherit}
svg.ic{flex:none;display:block}
#app{height:100%;min-height:560px;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.mark{width:28px;height:28px;border-radius:9px;background:var(--ink);display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:15px;font-weight:600;line-height:1.15}.brand small{display:block;font-size:12px;color:var(--mute)}
.sw2{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.sw2 button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;gap:6px}
.sw2 button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sw2 button:focus-visible,.tb:focus-visible,.b:focus-visible,.tab:focus-visible,.toggle input:focus-visible+span{outline:2px solid var(--sel);outline-offset:1px}
.tb{all:unset;cursor:pointer;height:34px;padding:0 13px;border:1px solid var(--line2);border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:#fff}
.tb:hover{background:var(--soft)}.tb.pri{background:var(--ink);border-color:var(--ink);color:#fff}.tb.pri:hover{background:#2a2f37}
.sp{flex:1}
#sum,#save{font-size:12.5px;color:var(--mute)}#sum b{color:var(--ink)}
#save.err{color:var(--err)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle span{width:36px;height:20px;border-radius:99px;background:#C9CED6;position:relative;transition:.15s}
.toggle span::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.15s}
.toggle input:checked+span{background:var(--sel)}.toggle input:checked+span::after{left:18px}
.toggle input:disabled+span{opacity:.45}
.dep{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.dep button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:8px;background:#fff;font-weight:700}
.dep b{color:var(--ink);min-width:14px;text-align:center}
.work{flex:1;min-height:0;display:flex;position:relative}
#vp{flex:1;min-width:0;position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);background-image:radial-gradient(#D3D7DE 1.1px,transparent 1.3px);background-size:24px 24px}
#vp.drag{cursor:grabbing}#vp.connect{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.zoom{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom button{all:unset;cursor:pointer;height:34px;min-width:34px;display:grid;place-items:center;font-size:15px;font-weight:600;padding:0 4px}
.zoom button:hover{background:var(--soft)}.zoom button:first-child{border-radius:10px 0 0 10px}.zoom button:last-child{border-radius:0 10px 10px 0;padding:0 12px;font-size:13px;border-left:1px solid var(--line)}
.zoom span{font-size:12.5px;font-weight:600;min-width:46px;text-align:center;color:var(--mute)}
.hint{position:absolute;right:14px;bottom:14px;max-width:420px;background:#fff;border:1px solid var(--line2);border-radius:11px;padding:8px 12px;font-size:12.5px;color:var(--mute);box-shadow:0 2px 8px rgba(0,0,0,.06);pointer-events:none}
#tbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:var(--ink);color:#fff;padding:5px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:4}
#tbar button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600}
#tbar button:hover{background:rgba(255,255,255,.14)}#tbar button[aria-pressed="true"]{background:#fff;color:var(--ink)}
#tbar button[disabled]{opacity:.35;cursor:default}#tbar i{width:1px;height:22px;background:rgba(255,255,255,.22);margin:0 4px}
/* mundo */
.band{position:absolute;left:30px;border-radius:34px;background:rgba(255,255,255,.66);border:1.5px solid #E1E4EA}
.lane{position:absolute;left:40px;top:44px;width:200px}
.lane b{display:flex;align-items:center;gap:12px;font-size:32px;font-weight:600;line-height:1.15}
.lane b i{flex:none;width:18px;height:18px;border-radius:6px;background:var(--c)}
.lane span{display:block;margin:8px 0 0 30px;font-size:22px;line-height:1.3;color:var(--faint)}
.colh{position:absolute;top:70px;text-align:center;font-size:28px;font-weight:500;color:var(--faint);letter-spacing:.01em}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.edge path.ln{fill:none;stroke:#8E97A4;stroke-width:1.6px;vector-effect:non-scaling-stroke;opacity:.7}
.edge.dash path.ln{stroke-dasharray:6 5}
.edge .lab{display:none}.edge .lab rect{fill:#fff;stroke:var(--c);stroke-width:2px}.edge .lab text{font-size:22px;font-weight:600;fill:var(--ink);font-family:var(--f-ui)}
.edge.on path.ln{stroke:var(--c);stroke-width:3.4px;opacity:1}.edge.in path.ln{stroke:var(--sel);stroke-width:2.4px;opacity:1}
.edge.on .lab,.edge.in .lab{display:block}.edge.off{opacity:.1}
.cardw{position:absolute;cursor:pointer;transition:opacity .2s}
.cardw.dim{opacity:.16}
.editing .cardw{cursor:grab}
.cardw.lift{z-index:20;opacity:.95;cursor:grabbing}
.cardw.lift .frame{box-shadow:0 0 0 7px var(--sel),0 50px 90px rgba(0,0,0,.3)}
#drop{position:absolute;border:4px dashed var(--sel);border-radius:34px;background:rgba(47,107,255,.07);pointer-events:none}
.ctitle{height:54px;display:flex;align-items:center;gap:12px;font-size:26px;font-weight:600;white-space:nowrap}
.ctitle i{flex:none;width:16px;height:16px;border-radius:5px;background:var(--c)}
.ctitle span{overflow:hidden;text-overflow:ellipsis}
.badge{margin-left:auto;font-style:normal;font-size:18px;font-weight:600;padding:2px 11px;border-radius:99px;flex:none}
.badge.ok{background:#E2F4EA;color:var(--ok)}.badge.ajuste{background:#FCEBCB;color:var(--warn)}
.cardw.sel .frame{box-shadow:0 0 0 7px var(--sel),0 30px 60px -10px rgba(16,34,63,.3)}
.cardw.nxt .frame{box-shadow:0 0 0 4px var(--c),0 20px 40px -10px rgba(16,34,63,.25)}
/* ===== telas do app ===== */
.frame{background:var(--p-bg);color:var(--p-ink);font-family:var(--f-app);position:relative;overflow:hidden;display:flex;flex-direction:column;text-align:left;line-height:1.35;box-shadow:0 0 0 1px rgba(16,34,63,.09),0 2px 6px rgba(16,34,63,.06),0 26px 50px -14px rgba(16,34,63,.25)}
.frame.phone{width:360px;height:780px;border-radius:48px}
.frame.desk{width:760px;height:680px;border-radius:14px}
.sbar{flex:none;height:46px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 7px;font-size:14px;font-weight:700}
.sic{display:flex;align-items:flex-end;gap:3px}.sic i{display:block;width:3.5px;background:var(--p-ink);border-radius:1px}
.sic i:nth-child(1){height:5px}.sic i:nth-child(2){height:8px}.sic i:nth-child(3){height:11px}
.sic b{display:block;width:24px;height:11px;margin-left:6px;border:1.6px solid var(--p-ink);border-radius:4px;position:relative}
.sic b::after{content:'';position:absolute;inset:1.5px;width:70%;background:var(--p-ink);border-radius:1px}
.home{flex:none;height:24px;display:grid;place-items:center}.home i{display:block;width:124px;height:5px;border-radius:3px;background:var(--p-ink);opacity:.9}
.dbar{flex:none;height:42px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#F1F3F7;border-bottom:1px solid var(--p-line)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#D0D6E1}
.url{flex:1;max-width:340px;height:26px;border-radius:8px;background:#fff;border:1px solid var(--p-line);display:flex;align-items:center;padding:0 12px;font-size:13px;color:var(--p-mute)}
.dnav{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--p-line)}
.dnav b{font-size:20px;letter-spacing:.02em}.who{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--p-mute)}.who em{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--p-ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.fbody{flex:1;min-height:0;overflow:hidden;padding:10px 22px 8px;display:flex;flex-direction:column;gap:12px}
.ffoot{flex:none;padding:12px 22px 10px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--p-line);background:var(--p-bg)}
.desk .fbody{padding:26px 48px 10px;gap:16px}
.desk .ffoot{flex-direction:row;justify-content:flex-end;padding:16px 48px;gap:12px}
.u-brand{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--p-mute)}
.u-h{font-size:26px;line-height:1.12;font-weight:700;letter-spacing:-.015em}.desk .u-h{font-size:32px}
.u-p{font-size:16.5px;color:var(--p-mute);line-height:1.4}.desk .u-p{font-size:17px}
.u-q{font-size:23px;line-height:1.25;font-weight:700;letter-spacing:-.01em}.desk .u-q{font-size:26px;max-width:640px}
.u-note{background:var(--p-soft);border-radius:14px;padding:12px 14px;font-size:14.5px;color:var(--p-mute)}
.u-bubble{align-self:flex-start;max-width:92%;background:#E7FFDB;border-radius:14px 14px 14px 4px;padding:10px 12px 24px;font-size:15.5px;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.u-bubble::after{content:'09:41  ✓✓';position:absolute;right:10px;bottom:5px;font-size:11px;color:#6E8077}
.u-banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;background:#EAF0FF;color:#1E3FA8}
.u-banner .bi{flex:none;width:22px;height:22px;border-radius:50%;background:#1E3FA8;color:#fff;display:grid;place-items:center;font-size:13px}
.u-banner.err{background:#FDECEA;color:#9B241B}.u-banner.err .bi{background:#B3261E}
.u-banner.ok{background:#E5F5EC;color:#14613C}.u-banner.ok .bi{background:#1A7048}
.u-field label{display:block;font-size:14px;font-weight:700;color:var(--p-mute);margin-bottom:6px}
.u-in{min-height:54px;display:flex;align-items:center;border:1.5px solid #C9D1DF;border-radius:14px;padding:0 16px;font-size:17px;background:#fff}
.u-field.bad .u-in{border-color:var(--p-err);border-width:2px}.u-field small{display:block;margin-top:6px;color:var(--p-err);font-size:14px;font-weight:700}
.u-prog{flex:none;height:10px;border-radius:99px;background:#E8ECF3;overflow:hidden}.u-prog i{display:block;height:100%;background:var(--p-acc);border-radius:99px}
.u-list{display:flex;flex-direction:column;flex:none}
.u-list.alts,.u-list.persons{gap:10px}
.desk .u-list.rows{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.desk .u-list.alts,.desk .u-list.persons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.u-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--p-line)}
.u-list.rows .u-row:last-child{border-bottom:0}
.u-rt{flex:1;min-width:0}.u-rt b{display:block;font-size:16.5px;line-height:1.22}.u-rt small{display:block;color:var(--p-mute);font-size:13.5px;margin-top:1px}
.u-rr{display:flex;align-items:center;gap:8px;flex:none}.chev{font-size:26px;color:#9AA6B8;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;white-space:nowrap;color:var(--p-mute)}
.chip i{width:9px;height:9px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--p-ok)}.chip.wait{color:var(--p-wait)}.chip.pend{color:var(--p-pend)}.chip.err{color:var(--p-err)}
.u-alt,.u-person{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1.5px solid var(--p-line);border-radius:16px;background:#fff}
.u-alt .lt{flex:none;min-width:32px;height:32px;border-radius:99px;background:var(--p-soft);display:grid;place-items:center;font-weight:700;font-size:14px;padding:0 6px}
.u-alt b,.u-person b{display:block;font-size:16.5px;line-height:1.25}.u-alt small,.u-person small{display:block;color:var(--p-mute);font-size:14px}
.u-alt.sel,.u-person.sel{border:2px solid var(--p-ink);background:var(--p-acc-s);padding:10.5px 13.5px}
.u-alt.sel .lt{background:var(--p-ink);color:#fff}
.u-person .av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--p-soft);display:grid;place-items:center;font-weight:700;font-size:16px}
.u-person>span:nth-child(2){flex:1}.rad{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #B3BED0}
.u-person.sel .rad{border-color:var(--p-ink);background:radial-gradient(var(--p-ink) 46%,transparent 52%)}
.u-seg{display:flex;background:var(--p-soft);border-radius:14px;padding:4px;flex:none}
.u-seg span{flex:1;text-align:center;padding:10px 6px;border-radius:11px;font-size:15px;font-weight:700;color:var(--p-mute)}
.u-seg span.on{background:#fff;color:var(--p-ink);box-shadow:0 1px 3px rgba(16,34,63,.18)}
.u-check{display:flex;gap:12px;align-items:center;font-size:16.5px}
.u-check i{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid #B3BED0;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px;color:#fff}
.u-check.done i{background:var(--p-ink);border-color:var(--p-ink)}
.u-stats{display:flex;flex:none;border:1px solid var(--p-line);border-radius:16px;overflow:hidden}
.u-stats>div{flex:1;padding:12px 14px;border-left:1px solid var(--p-line);min-width:0}.u-stats>div:first-child{border-left:0}
.u-stats b{display:block;font-size:26px;line-height:1.1}.u-stats small{display:block;font-size:13px;color:var(--p-mute);margin-top:2px}
.u-table{width:100%;border-collapse:collapse;font-size:15px;flex:none}
.u-table th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--p-mute);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--p-line)}
.u-table td{padding:12px 10px;border-bottom:1px solid var(--p-line)}
.u-tlist{flex:none;display:flex;flex-direction:column}
.u-tlist>div{padding:12px 0;border-bottom:1px solid var(--p-line)}.u-tlist b{display:block;font-size:17px}.u-tlist small{display:block;font-size:14px;color:var(--p-mute);margin-top:2px}
.phone .u-table{display:none}.desk .u-tlist{display:none}
.u-btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:0 18px;border-radius:16px;background:var(--p-ink);color:#fff;font-size:17px;font-weight:700;text-align:center;line-height:1.2}
.u-btn.alt{background:var(--p-soft);color:var(--p-ink)}.u-btn.dis{opacity:.4}
.desk .u-btn{min-height:46px;border-radius:12px;font-size:15.5px;min-width:200px}
.u-big{flex:none;width:76px;height:76px;border-radius:50%;background:var(--p-acc-s);display:grid;place-items:center;font-size:38px;font-weight:700}
.ix [data-to]{cursor:pointer}.ix [data-to]:hover,.ix [data-to]:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
/* inspetor */
#drawer{flex:none;width:410px;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:6}
.ih{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0}
.ik{font-size:12.5px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:8px}.ik i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.x{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--mute)}.x:hover{background:var(--soft)}
.it{margin:6px 16px 10px;font-size:21px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 9px;font-size:13px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.ibody{flex:1;overflow-y:auto;padding:16px 16px 60px}
.isub{margin:0 0 14px;color:var(--mute);font-size:14px;line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
.sec{margin-top:18px}.sec h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.fld{margin-bottom:13px}.fld>label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:5px}
.inp{width:100%;height:36px;border:1px solid var(--line2);border-radius:9px;padding:0 10px;font-size:13.5px;background:#fff}
textarea.inp{height:auto;min-height:66px;padding:8px 10px;resize:vertical;line-height:1.4}
.inp:focus{outline:2px solid var(--sel);outline-offset:-1px;border-color:transparent}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}.chk input{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}

   if(sj(a[kind][id])===sj(b[kind][id]))return;

async function persist(){
 if(!DB){setSave('nodb');return;}
 if(CANWRITE===false){setSave('readonly');return;}
 if(persisting){again=true;return;}
 persisting=true;
 try{
  const target=clone(OV),ops=diffOps(SAVED,target);
  for(const op of ops)await op();
  SAVED=target;setSave('saved');
 }catch(e){setSave('error',e&&e.code==='invalid_argument'?'Sem permissão para editar':'Não foi possível salvar');}
 persisting=false;
 if(again){again=false;persist();}
}

/* ---------- operações de edição ---------- */
function ensureEdge(f,t,l){
 if(!SM[f]||!SM[t])return;
 if(EDGES.some(e=>e.f===f&&e.t===t))return;
 OV.edges[uid('e_')]={f,t,l:l||'Continuar'};
}
function clearTo(b,t){
 const k=b[0];if(k==='btn'&&b[2]===t){b[2]=null;return true;}
 if(k==='row'&&b[5]===t){b[5]=null;return true;}if(k==='alt'&&b[4]===t){b[4]=null;return true;}return false;
}
function removeEdge(id){
 const e=EDGES.find(x=>x.id===id);if(!e)return;
 if(BASE.edges[id])OV.edges[id]={deleted:true};else delete OV.edges[id];
 const left=EDGES.some(x=>x.id!==id&&x.f===e.f&&x.t===e.t);
 if(!left&&SM[e.f]){const s=editable(e.f);let ch=false;s.states.forEach(st=>{[st.blocks,st.foot].forEach(arr=>arr.forEach(b=>{if(clearTo(b,e.t))ch=true;}));});if(ch)OV.screens[e.f]=s;}
}
function normalizeCell(laneId,colId){
 S.filter(s=>s.lane===laneId&&s.col===colId).sort((a,b)=>(a.ord-b.ord)||(a.id<b.id?-1:1)).forEach((s,i)=>{
  if(s.ord!==i){const c=OV.screens[s.id]?clone(OV.screens[s.id]):editable(s.id);c.ord=i;OV.screens[s.id]=c;}
 });
}
function moveScreen(id,tg){
 act(()=>{
  const s=editable(id);s.lane=tg.lane;s.col=tg.col;
  const others=S.filter(x=>x.id!==id&&x.lane===tg.lane&&x.col===tg.col).sort((a,b)=>(a.ord-b.ord)||(a.id<b.id?-1:1));
  const list=others.map(x=>x.id);list.splice(clamp(tg.idx,0,list.length),0,id);
  OV.screens[id]=s;
  list.forEach((sid,i)=>{const c=sid===id?OV.screens[id]:(OV.screens[sid]?clone(OV.screens[sid]):editable(sid));c.ord=i;OV.screens[sid]=c;});
 });
 toast('Tela movida');
}
function deleteScreen(id){
 act(()=>{
  EDGES.filter(e=>e.f===id||e.t===id).forEach(e=>{if(BASE.edges[e.id])OV.edges[e.id]={deleted:true};else delete OV.edges[e.id];});
  S.forEach(s=>{if(s.id===id)return;let ch=false;const c=editable(s.id);c.states.forEach(st=>{[st.blocks,st.foot].forEach(arr=>arr.forEach(b=>{if(clearTo(b,id))ch=true;}));});if(ch)OV.screens[s.id]=c;});
  if(BASE.screens[id])OV.screens[id]={id,deleted:true};else delete OV.screens[id];
 });
 ST.sel=null;ST.confirm=null;renderInspector();paint();toast('Tela excluída. Use Desfazer para voltar.');
}
function duplicateScreen(id){
 const nid=uid('s_');
 act(()=>{const s=editable(id);s.id=nid;s.t=s.t+' (cópia)';s.ord=s.ord+.5;OV.screens[nid]=s;rebuildModel();normalizeCell(s.lane,s.col);});
 select(nid);toast('Tela duplicada');
}
function restoreScreen(id){act(()=>{delete OV.screens[id];});toast('Tela restaurada ao original');}
function connectTo(f,t){
 act(()=>{if(!EDGES.some(e=>e.f===f&&e.t===t))OV.edges[uid('e_')]={f,t,l:'Continuar'};});
 ST.tool='select';syncTools();ST.tab='fluxo';select(f,{focus:false});toast('Ligação criada. Dê um nome a ela na aba Fluxo.');

/* ---------- mapa mental ---------- */
function mindTree(root,maxD){
 const seen=new Set([root]),node={id:root,ch:[],d:0},q=[node];
 while(q.length){const n=q.shift();if(n.d>=maxD)continue;
  OUT[n.id].forEach(e=>{if(seen.has(e.t)){n.ch.push({id:e.t,label:e.l,d:n.d+1,ref:true,ch:[]});return;}seen.add(e.t);const c={id:e.t,label:e.l,d:n.d+1,ch:[]};n.ch.push(c);q.push(c);});}
 return node;
}
function drawMind(){
 const root=ST.sel&&SM[ST.sel]?ST.sel:(SM.g_convite?'g_convite':S[0].id),tree=mindTree(root,ST.depth),all=[];let leaf=0;
 (function lay(n){all.push(n);if(!n.ch.length){n.row=leaf++;}else{n.ch.forEach(lay);n.row=(n.ch[0].row+n.ch[n.ch.length-1].row)/2;}})(tree);
 const NW=230,NH=62,GX=400,GY=86,PAD=30,maxd=Math.max.apply(null,all.map(n=>n.d));
 const W=PAD*2+maxd*GX+NW,H=PAD*2+Math.max(0,leaf-1)*GY+NH;let ed='',lab='',nodes='';
 all.forEach(n=>{
  const x=PAD+n.d*GX,y=PAD+n.row*GY;
  n.ch.forEach(c=>{const x2=PAD+c.d*GX,y2=PAD+c.row*GY,mx=(x+NW+x2)/2;ed+=`<path class="me" d="M${x+NW},${y+NH/2} C${mx},${y+NH/2} ${mx},${y2+NH/2} ${x2},${y2+NH/2}"/>`;lab+=`<text class="ml" x="${mx}" y="${(y+y2)/2+NH/2-7}" text-anchor="middle">${esc(c.label)}</text>`;});
  const s=SM[n.id];
  nodes+=`<g class="mn${n.ref?' ref':''}${n.d===0?' root':''}" data-id="${n.id}" tabindex="0" role="button" style="--c:var(--c-${s.actor})"><rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="12"/><rect class="dot" x="${x+14}" y="${y+16}" width="9" height="9" rx="3"/><text class="t" x="${x+32}" y="${y+25}">${n.ref?'↺ ':''}${esc(s.t)}</text><text class="s" x="${x+32}" y="${y+45}">${esc(laneOf(s).t)} · ${esc(colOf(s).t)}</text></g>`;
 });
 $('#mind').innerHTML=`<h2>Próximos passos a partir de “${esc(SM[root].t)}”</h2><p class="mctl">Use “Passos à frente” na barra para abrir ou fechar níveis. Tracejado: a tela já aparece em outro ponto do caminho.</p><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${ed}${lab}${nodes}</svg>`;
}

function renderSim(){
 const s=SM[SIM.id];if(!s){$('#sim').hidden=true;return;}
 const outs=OUT[s.id],n=s.states.length,dev=ST.device,D=DEV[dev];
 const k=dev==='phone'?Math.min(1.2,Math.max(.55,(innerHeight-160)/D.h)):Math.min(1.25,Math.max(.5,(Math.min(innerWidth,1100)-(innerWidth>900?470:40))/D.w));
 $('#sim').innerHTML=`<div class="ovin"><div class="ovh"><h2>Simulação do app</h2><div class="sw2" id="sdev"><button data-sdev="phone" aria-pressed="${dev==='phone'}">Celular</button><button data-sdev="desk" aria-pressed="${dev==='desk'}">Computador</button></div><span class="sp" style="flex:1"></span><button class="tb" id="sBack"${SIM.hist.length?'':' disabled style="opacity:.4"'}>Voltar uma tela</button><button class="tb" id="sRestart">Recomeçar</button><button class="tb pri" id="sClose">Fechar</button></div>
 <div class="simgrid"><div class="stagebox" style="width:${D.w*k}px;height:${D.h*k}px"><div style="transform:scale(${k});transform-origin:0 0;width:${D.w}px;height:${D.h}px">${frame(s,SIM.vi,true)}</div></div>
 <div class="side"><div class="ik" style="--c:var(--c-${laneOf(s).c})"><i></i>${esc(laneOf(s).t)} · ${esc(colOf(s).t)}</div><h3>${esc(s.t)}</h3><p class="mut" style="margin:0">${esc(s.sub||'')}</p>
 ${n>1?`<div class="pl"><div class="lbl">Estado para testar</div></div><div class="chips">${s.states.map((x,i)=>`<button data-vi="${i}" aria-pressed="${i===SIM.vi}">${esc(x.n)}</button>`).join('')}</div>`:''}
 <div class="pl"><div class="lbl">Nesta tela você pode ir para</div>${outs.length?outs.map(e=>`<button data-sgo="${e.t}"><em>${esc(e.l)}</em>→ ${esc(SM[e.t].t)}${e.d?'<small>fora do app</small>':''}</button>`).join(''):'<span class="mut">Fim do caminho.</span>'}</div>
 <div class="crumbs">${SIM.hist.length?'Você passou por: '+SIM.hist.concat([SIM.id]).map(i=>esc(SM[i]?SM[i].t:'?')).join(' → '):'Toque nos botões da tela ou use a lista acima.'}</div></div></div></div>`;
 $('#sim').scrollTop=0;
}
$('#sim').addEventListener('click',e=>{
 const t=e.target;
 const to=t.closest('[data-to]');if(to){simGo(to.dataset.to);return;}
 const g=t.closest('[data-sgo]');if(g){simGo(g.dataset.sgo);return;}
 const v=t.closest('[data-vi]');if(v){SIM.vi=+v.dataset.vi;renderSim();return;}
 const dv=t.closest('[data-sdev]');if(dv){setDevice(dv.dataset.sdev);return;}
 if(t.id==='sBack'&&SIM.hist.length){SIM.id=SIM.hist.pop();SIM.vi=0;renderSim();}
 if(t.id==='sRestart'){SIM.id=SM.g_convite?'g_convite':S[0].id;SIM.vi=0;SIM.hist=[];renderSim();}
 if(t.id==='sClose'){$('#sim').hidden=true;const id=SIM.id;if(ST.view==='mind')setView('over');select(id);}
});
$('#sim').addEventListener('keydown',e=>{if(e.key==='Enter'){const to=e.target.closest&&e.target.closest('[data-to]');if(to)simGo(to.dataset.to);}});

/* ---------- fábrica ---------- */
const reviewLabel=id=>{const r=REVIEWS[id];return r&&r.status?(r.status==='ok'?'Aprovada':'Pede ajuste'):'Sem decisão';};
function specMD(){
 const L=['# RMDS · Especificação das telas','','Gerado pelo Mapa de telas RMDS. Nomes, números e municípios são exemplos.','','## Suposições a confirmar',...ASSUME.map(a=>'- '+a),'','## Áreas do INMSD',...DOM.map(d=>`- ${d[0]} (${d[1]}, ${d[2]} perguntas)`),''];
 S.forEach(s=>{
  L.push('## '+s.t,'',`- Quem usa: ${laneOf(s).t} · Etapa: ${colOf(s).t}`,`- O que acontece: ${s.sub||''}`,`- Versões: celular e computador (mesmo conteúdo)`,`- Estados: ${s.states.map(x=>x.n).join(', ')}`);
  if(s.nota)L.push('- Regra: '+s.nota);
  L.push('- Vai para:');OUT[s.id].forEach(e=>L.push(`  - ${e.l} → ${SM[e.t].t}${e.d?' (fora do app)':''}`));if(!OUT[s.id].length)L.push('  - Fim do caminho');
  L.push(`- Dados: ${s.dados.join(', ')||'nenhum'}`,'- Chamadas de API:');s.api.forEach(a=>L.push('  - `'+a+'`'));if(!s.api.length)L.push('  - nenhuma');
  const r=REVIEWS[s.id];L.push(`- Revisão: ${reviewLabel(s.id)}${r&&r.checks?` · checklist ${r.checks.filter(Boolean).length}/${CHECKS.length}`:''}`);
  COMMENTS.filter(c=>c.screen===s.id).forEach(c=>L.push(`  - Comentário (${fmt(c.at)}): ${c.text.replace(/\n/g,' ')}`));
  L.push('');
 });
 return L.join('\n');
}
function specJSON(){
 return {titulo:'RMDS · Especificação das telas',suposicoes:ASSUME,areas:DOM.map(d=>({nome:d[0],perguntas:d[1],total:d[2]})),
  telas:S.map(s=>({id:s.id,titulo:s.t,quemUsa:laneOf(s).t,etapa:colOf(s).t,descricao:s.sub||'',regra:s.nota||null,estados:s.states.map(x=>({nome:x.n,blocos:x.blocks,rodape:x.foot})),
   vaiPara:OUT[s.id].map(e=>({tela:e.t,quando:e.l,foraDoApp:!!e.d})),dados:s.dados,api:s.api,revisao:reviewLabel(s.id),checklist:(REVIEWS[s.id]&&REVIEWS[s.id].checks)||[],comentarios:COMMENTS.filter(c=>c.screen===s.id).map(c=>c.text)}))};
}
function openFab(){
 const ents={},apis={};S.forEach(s=>{s.dados.forEach(d=>{(ents[d]=ents[d]||[]).push(s.t);});s.api.forEach(a=>{(apis[a]=apis[a]||[]).push(s.t);});});
 const rows=Object.keys(apis).sort((a,b)=>a.split(' ').slice(1).join(' ').localeCompare(b.split(' ').slice(1).join(' '))).map(a=>{const p=a.split(' ');return `<tr><td><code>${esc(p[0])}</code></td><td><code>${esc(p.slice(1).join(' '))}</code></td><td>${apis[a].map(esc).join(', ')}</td></tr>`;}).join('');
 $('#fab').innerHTML=`<div class="ovin"><div class="ovh"><h2>Para a fábrica de software</h2><span style="flex:1"></span>${DL?'<button class="tb" data-dl="md">Baixar especificação (.md)</button><button class="tb" data-dl="json">Baixar (.json)</button>':''}<button class="tb pri" id="fClose">Fechar</button></div>
 <div class="card"><h3>Suposições a confirmar</h3><ul>${ASSUME.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>
 <div class="card"><h3>Entidades (${Object.keys(ents).length})</h3><div class="tags">${Object.keys(ents).sort().map(e=>`<span title="${esc(ents[e].join(', '))}">${esc(e)}</span>`).join('')}</div></div>
 <div class="card"><h3>Chamadas de API (${Object.keys(apis).length})</h3><div style="overflow-x:auto"><table class="ft"><thead><tr><th>Método</th><th>Caminho</th><th>Telas que usam</th></tr></thead><tbody>${rows}</tbody></table></div></div>
 <div class="card"><h3>Áreas do INMSD</h3><table class="ft"><thead><tr><th>Área</th><th>Perguntas</th><th>Total</th></tr></thead><tbody>${DOM.map(d=>`<tr><td>${esc(d[0])}</td><td>${esc(d[1])}</td><td>${d[2]}</td></tr>`).join('')}</tbody></table></div></div>`;
 $('#fab').hidden=false;$('#fab').scrollTop=0;
}
$('#fab').addEventListener('click',async e=>{
 const t=e.target;if(t.id==='fClose')$('#fab').hidden=true;
 const k=t.dataset&&t.dataset.dl;
 if(k&&DL){try{await DL.save({filename:k==='md'?'rmds-especificacao-telas.md':'rmds-especificacao-telas.json',data:k==='md'?specMD():JSON.stringify(specJSON(),null,2)});toast('Arquivo salvo');}catch(err){if(!err||err.code!=='declined')toast('Não foi possível salvar por aqui');}}
});
let toastT=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- barra superior e teclado ---------- */
$$('#vsw button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$$('#dsw button').forEach(b=>b.onclick=()=>setDevice(b.dataset.dev));
$('#bSim').onclick=()=>openSim(ST.sel||'g_convite');
$('#bFab').onclick=openFab;
document.addEventListener('keydown',e=>{
 const mod=e.ctrlKey||e.metaKey,inField=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
 if(mod&&e.key.toLowerCase()==='z'&&ST.edit&&!inField){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
 if(e.key!=='Escape')return;
 if(!$('#modal').hidden)closeModal();else if(!$('#sim').hidden)$('#sim').hidden=true;else if(!$('#fab').hidden)$('#fab').hidden=true;
 else if(ST.tool==='connect'){ST.tool='select';syncTools();}else if(ST.sel)select(null);
});
let started=false;
function startView(){if(started||vp.clientWidth<100||vp.clientHeight<100)return;started=true;if(ST.sel)focusSel();else startFrame();}
if(window.ResizeObserver)new ResizeObserver(startView).observe(vp);

rebuildModel();buildWorld();apply(false);
$('#sum').textContent=S.length+' telas';setHint();startView();
(function(){const h=location.hash.replace('#','');if(h&&SM[h])select(h);})();
initCaps();
</script>

</body></html>
